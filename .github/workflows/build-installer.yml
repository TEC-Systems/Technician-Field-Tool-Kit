name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the version in version.txt as a new release'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content version.txt -First 1).Trim()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Publish releases only from main.' }
            if (git ls-remote --tags origin "refs/tags/$expected") { throw "Release tag $expected already exists." }
          }
          elseif ('${{ github.ref_name }}' -ne $expected) { throw "Tag must be $expected" }
      - name: Build and verify installer
        shell: powershell
        run: |
          try { .\packaging\Build-Installer.ps1 }
          catch {
            $detail = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TEC-Systems-FieldToolkit-installer
          path: |
            dist/TEC-Systems-FieldToolkit-Setup.exe
            dist/TEC-Systems-FieldToolkit-Install.zip
            dist/TEC-Systems-FieldToolkit-Install.7z
            dist/SHA256SUMS.txt
            dist/app-icon.png
            dist/tray-icon.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v' + (Get-Content version.txt -First 1).Trim()
          gh release create $tag dist/TEC-Systems-FieldToolkit-Setup.exe dist/TEC-Systems-FieldToolkit-Install.zip dist/TEC-Systems-FieldToolkit-Install.7z dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "TEC Systems Field Toolkit $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $tag." }
