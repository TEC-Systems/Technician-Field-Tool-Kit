name: Build installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content version.txt -First 1).Trim()
          if ('${{ github.ref_name }}' -ne $expected) { throw "Tag must be $expected" }
      - name: Build and verify installer
        shell: powershell
        run: .\packaging\Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TEC-Systems-FieldToolkit-installer
          path: |
            dist/TEC-Systems-FieldToolkit-Setup.exe
            dist/TEC-Systems-FieldToolkit-Install.zip
            dist/SHA256SUMS.txt
            dist/app-icon.png
            dist/tray-icon.png
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/TEC-Systems-FieldToolkit-Setup.exe dist/TEC-Systems-FieldToolkit-Install.zip dist/SHA256SUMS.txt --title 'TEC Systems Field Toolkit ${{ github.ref_name }}' --generate-notes
