name: Remove canceled v0.3.5 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish canceled release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.3.5 --repo TEC-Systems/Technician-Field-Tool-Kit --cleanup-tag --yes
